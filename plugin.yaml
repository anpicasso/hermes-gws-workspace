name: gws-workspace
version: 0.10.0
manifest_version: 2
kind: standalone
description: Multi-account native gws adapter, curated Workspace tools, approvals, and slash-command push watches
license: MIT
requires_hermes: ">=0.23.2"
python_dependencies:
  - PyYAML>=6,<7
  - aiohttp>=3.9,<4
  - google-auth[requests]>=2.40,<3
provides_tools:
  - gws_accounts
  - gws_api
  - gws_gmail_search
  - gws_gmail_read
  - gws_gmail_draft
  - gws_gmail_send
  - gws_drive_search
  - gws_drive_read
  - gws_drive_upload
  - gws_drive_share
  - gws_calendar_list
  - gws_calendar_freebusy
  - gws_calendar_create
  - gws_calendar_update
  - gws_schema
provides_hooks:
  - pre_gateway_dispatch
  - pre_tool_call
config_schema:
  gws_bin:
    type: str
    default: gws
    description: Path to the gws executable if it is not on the gateway PATH
  watch_gmail_topic:
    type: str
    default: ""
    description: Pub/Sub topic in the OAuth client project, e.g. projects/PROJECT/topics/gmail-watch
  watch_gmail_subscription:
    type: str
    default: ""
    description: Exact operator-provisioned authenticated push subscription, e.g. projects/PROJECT/subscriptions/gmail-watch
  watch_callback_url:
    type: str
    default: ""
    description: Public HTTPS base that a reverse proxy/tunnel forwards to the worker's loopback callback receiver
  watch_gmail_push_audience:
    type: str
    default: ""
    description: Exact HTTPS audience configured on the authenticated Pub/Sub push subscription
  watch_gmail_push_service_account:
    type: str
    default: ""
    description: Exact Google service-account email authorized to push Gmail notifications
  watch_routes:
    type: dict
    default: {routes: []}
    description: Operator-provisioned Hermes webhook routes bound to exact profile, principal, chat and delivery mode
  watch_reconcile_seconds:
    type: int
    default: 300
    description: Reconciliation interval for a durable source cursor; push hints still wake the worker independently
